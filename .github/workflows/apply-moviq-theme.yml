name: Apply Kanc Training Theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject MOVIQ styles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          for tag in ['<link rel="stylesheet" href="kt.css?v=2">','<link rel="stylesheet" href="kt-mobile.css?v=2">']:
              if tag not in s:
                  s=s.replace('</head>',tag+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit theme
        run: |
          git config user.name "Kancgym"
          git config user.email "338981997+Kancgym@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply mobile-first Kanc Training theme"
          git push
